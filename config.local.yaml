app_name: "nova backend"

logging:
  level: debug

http:
  address: :8000
  readtimeout: 10
  writetimeout: 2
  idletimeout: 10
  readheadertimeout: 4
  maxheaderbytes: 1024

observability:
  trace:
    endpoint: localhost:4317
  metric:
    endpoint:
  log:
    endpoint: localhost:4317

realtime-hub:
  goroutine:
    main: 5
    router: 10
    broker: 10

websocket:
  ping-interval: 15s
  write-wait: 5s
  pong-wait: 5s
  message-size: 5000
  max-messages: 1024

redis:
  address: "localhost:6379"
  username: 
  password: 
  database: 0

postgres:
  address: "localhost:5432"
  username: "postgres"
  password: "Abx305"
  database: "Nova"
  
authentication:
  access:
    secret: "meow-meow"
    expires_in: 30000
    issuer: "neo"
    audience: "api-server"
  refresh: 
    secret: "meow-meow"
    expires_in: 7200000
    issuer: "neo"
    audience: "api-server"

users:
  keyPrefix: "users:"
  seed: "./seeds/users.json"
  cacheduration: 30s

posts: 
  keyPrefix: "posts:"
  seed: "./seeds/posts.json"
  cacheduration: 30s

comments:
  keyPrefix: "comments:"
  seed: "./seeds/comments.json"
  cacheduration: 30s

clans:
  keyPrefix: "clans:"
  seed: "./seeds/clans.json"
  members-seed: "./seeds/clan_members.json"
  cacheduration: 30s

channels:
  keyPrefix: "channels:"
  seed: "./seeds/channels.json"
  cacheduration: 30s

stats:
  keyPrefix: "stats:"
  seed: "./seeds/stats.json"
  progression-seed: "./seeds/stats-progression.json"
  cacheduration: 30s